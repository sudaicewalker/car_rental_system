<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EaseDrive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .auth-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .brand-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(13,110,253,0.4);
    }
    .brand-logo h1 {
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand-logo p {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .form-label {
      color: rgba(255,255,255,0.75);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-control {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: white;
      padding: 12px 16px;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.12);
      border-color: #0d6efd;
      color: white;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.25);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .input-group-text {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-right: none;
      color: rgba(255,255,255,0.5);
      border-radius: 10px 0 0 10px;
    }
    .input-group .form-control { border-left: none; border-radius: 0 10px 10px 0; }
    .btn-login {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 13px;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(13,110,253,0.4);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13,110,253,0.5);
      color: white;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 24px 0;
    }
    .auth-footer {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #4dabf7;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { color: #74c0fc; }
    .alert-error {
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.3);
      border-radius: 10px;
      color: #f8a9b2;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mb-form { margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-logo">
        <div class="logo-icon">
          <i class="fas fa-car-side"></i>
        </div>
        <h1>EaseDrive</h1>
        <p>Car Rental Management System</p>
      </div>

      {% if error %}
      <div class="alert-error">
        <i class="fas fa-exclamation-circle"></i>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{% url 'login_page' %}">
        {% csrf_token %}
        <div class="mb-form">
          <label class="form-label"><i class="fas fa-user me-2"></i>Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            required
            autofocus
          />
        </div>
        <div class="mb-form">
          <label class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn-login mt-2">
          <i class="fas fa-sign-in-alt me-2"></i>Sign In
        </button>
      </form>

      <hr class="divider" />

      <div class="auth-footer">
        Don't have an account? <a href="{% url 'signup_page' %}">Create Account</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
